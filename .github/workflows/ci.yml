name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    # 用 macOS：仓库内置 libpdfium.dylib + ONNX Runtime 可用，pdfium / 引擎测试可真实运行
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # 缓存重型依赖树（ort/fastembed/pdfium/tauri），避免每次冷编译
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查 + 构建（含 tsc）
        run: npm run build
      - name: 前端 Lint（ESLint + react-hooks）
        run: npm run lint
      - name: 前端单元测试
        run: npm test
      - name: Clippy（警告即失败）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - name: 引擎单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # 回归门禁（W6-5 快档）：无模型层跑合成语料，比 baseline_metrics.json（F1/召回/AUC）。
      # 语料 hash 先行校验；任一指标越容差即失败并打印新旧全表。预算 <60s。
      - name: 语料回归门禁（快档）
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features dev-tools corpus_regression -- --nocapture

  # 跨平台：Linux 编译检查；Windows 跑完整引擎测试（随包 pdfium.dll 为 x64，可真跑）。
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux 依赖
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 占位 frontendDist（tauri-build 需其存在）
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html
      # Windows：跑引擎测试验证平台分叉逻辑（路径分隔 / GBK 文件名 / pdfium.dll 加载）
      - name: Windows 引擎测试
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # Linux：仅编译检查（无 libpdfium.so，不跑需 pdfium 的测试）
      - name: Linux 编译检查
        if: matrix.os == 'ubuntu-24.04'
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

  # 依赖供应链审计（非阻塞信息位；出 CVE 时 CI 变红提醒）
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri # Cargo.lock 在 src-tauri/ 子目录，非仓库根
