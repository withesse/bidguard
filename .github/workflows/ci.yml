name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    # 用 macOS：仓库内置 libpdfium.dylib + ONNX Runtime 可用，pdfium / 引擎测试可真实运行
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 安装前端依赖
        run: npm install
      - name: 前端类型检查 + 构建（含 tsc）
        run: npm run build
      - name: 前端单元测试
        run: npm test
      - name: Clippy（警告即失败）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - name: 引擎单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # 跨平台编译检查：Windows/Linux 上 cargo check，避免跨平台编译错误拖到打 tag 时才暴露。
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux 依赖
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 占位 frontendDist（tauri-build 需其存在）
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html
      - name: 跨平台编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
