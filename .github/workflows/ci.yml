name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    # 用 macOS：仓库内置 libpdfium.dylib + ONNX Runtime 可用，pdfium / 引擎测试可真实运行
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # 缓存重型依赖树（ort/fastembed/pdfium/tauri），避免每次冷编译
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查 + 构建（含 tsc）
        run: npm run build
      - name: 前端 Lint（ESLint + react-hooks）
        run: npm run lint
      - name: 前端单元测试
        run: npm test
      - name: Clippy（警告即失败）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - name: 引擎单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # 回归门禁（W6-5 快档）：无模型层跑合成语料，比 baseline_metrics.json（F1/召回/AUC）。
      # 语料 hash 先行校验；任一指标越容差即失败并打印新旧全表。预算 <60s。
      - name: 语料回归门禁（快档）
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features dev-tools corpus_regression -- --nocapture

  # 跨平台：Linux 编译检查；Windows 跑完整引擎测试（随包 pdfium.dll 为 x64，可真跑）。
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 打包冒烟需 node：tauri build 会执行 beforeBuildCommand（npm run build）。
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux 依赖
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 占位 frontendDist（tauri-build 需其存在）
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html
      # Windows：跑引擎测试验证平台分叉逻辑（路径分隔 / GBK 文件名 / pdfium.dll 加载）
      - name: Windows 引擎测试
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # Linux：仅编译检查（无 libpdfium.so，不跑需 pdfium 的测试）
      - name: Linux 编译检查
        if: matrix.os == 'ubuntu-24.04'
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      # 单一应用二进制守卫（秒级）：tauri 从清单的 bin 目标里挑主程序，且【不看
      # required-features】——包内一旦多出第二个 bin，它就可能选错并在打包阶段失败
      # （v0.6.0 首次发布即因 dev-tools 门控的 corpusgen 被当成主程序而三平台全挂）。
      # 开发用 CLI 一律声明为 [[example]]：example 不属于应用二进制。
      - name: 单一应用二进制守卫
        shell: bash
        run: |
          bins=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(' '.join(t['name'] for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bin' in t['kind']))")
          echo "bin targets: [$bins]"
          if [ "$bins" != "bidguard" ]; then
            echo "::error::期望恰好一个应用二进制 bidguard，实得 [$bins]。tauri 会据此挑错二进制打包——请把开发用 CLI 改声明为 [[example]]（见 src-tauri/Cargo.toml 注释）。"
            exit 1
          fi

      # 打包冒烟（Linux · debug）：真正跑一次 tauri build 到出 .deb，覆盖二进制选取之外的
      # 打包配置问题（资源/图标路径、配置 schema、beforeBuildCommand）。用 debug 构建换速度；
      # 正式产物仍由 release.yml 出。此前 CI 从不跑 tauri build，这类问题只有打 tag 才暴露。
      - name: 安装前端依赖（打包冒烟用）
        if: matrix.os == 'ubuntu-24.04'
        run: npm ci
      - name: 打包冒烟（Linux · debug · deb）
        if: matrix.os == 'ubuntu-24.04'
        run: npm run tauri build -- --debug --bundles deb

  # 依赖供应链审计（非阻塞信息位；出 CVE 时 CI 变红提醒）
  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check 会把结果写成 check-run（缺 checks: write 时报
    # "Resource not accessible by integration"，即便无漏洞该 job 也红）。
    # 就近声明而非放顶层：其余 job 保持默认权限，最小授权。
    permissions:
      contents: read # actions/checkout
      checks: write # 创建审计结果的 check-run
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri # Cargo.lock 在 src-tauri/ 子目录，非仓库根
