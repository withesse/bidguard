name: release

# 打 tag（v*）或手动触发 → 构建并发布到 GitHub Release（草稿）。
# 目标：macOS(arm64) + Windows(x64, arm64)。暂不构建 Linux。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 原生 aarch64(Apple 芯片)。Intel/x86 不支持：ort 无 x86_64-apple-darwin 预编译库。
          - platform: macos-latest
            args: ""
          # Windows x64
          - platform: windows-latest
            args: ""
          # Windows arm64(交叉编译)。⚠️ 待实测：ort 需有 aarch64-pc-windows-msvc 预编译库，
          # 且随包 pdfium.dll 为 x64 → arm64 上 PDF 会退到 pdf-extract(扫描件 OCR 不可用)，见 BUILD.md。
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust-target: aarch64-pc-windows-msvc
          # 暂不构建 Linux(用户决定)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: 交叉编译目标(如 Windows arm64)
        if: matrix.rust-target
        run: rustup target add ${{ matrix.rust-target }}

      - name: 安装前端依赖
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名：私钥与密码存在 GitHub Secrets。
          # tauri.conf.json 已配 createUpdaterArtifacts:true + 公钥，构建时生成 .sig 与 latest.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 证书/公证（可选；配好后补 secrets 即生效）：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BidGuard ${{ github.ref_name }}"
          releaseBody: "原本 · 标书查重 —— 本地标书交叉比对与围标识别。发布草稿后 latest.json 才对旧版本生效。"
          releaseDraft: true
          prerelease: false
          # 生成并上传 latest.json（自动更新清单）
          includeUpdaterJson: true
          args: ${{ matrix.args }}
