name: release

# 打 tag（v*）或手动触发 → 构建并发布到 GitHub Release（草稿）。
# 目标：macOS(arm64) + Windows(x64)。暂不构建 Linux / Windows arm64。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v0.5.1）；手动触发必填，tag 推送时忽略"
        required: false
        default: ""

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  # 发布前置守卫：内嵌验签公钥仍是开发钥（lic-dev-*）时禁止出厂——开发私钥按
  # docs/license-activation-scheme-v2.md §11 视为已泄漏，未换发即发布等于任何人可伪造许可。
  # 放 release 而非 ci：日常开发允许带开发钥跑测试，只有对外发布是硬阻断点。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 许可验签密钥守卫（开发钥禁止发布）
        run: |
          # 只匹配带引号的 kid 字面量（"lic-dev-…"），不误伤日后注释里的历史提及
          if grep -n '"lic-dev-' src-tauri/src/license/keys.rs; then
            echo "::error file=src-tauri/src/license/keys.rs::TRUSTED_KEYS 仍含开发验签公钥（lic-dev-*）。按 docs/license-activation-scheme-v2.md §11 A 组在离线机换发正式密钥后方可发布。"
            exit 1
          fi
          echo "OK：未发现开发验签公钥。"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 原生 aarch64(Apple 芯片)。Intel/x86 不支持：ort 无 x86_64-apple-darwin 预编译库。
          - platform: macos-latest
            args: ""
          # Windows x64。Win11-on-ARM 靠系统 x64 仿真运行此包；暂不出原生 arm64(见 BUILD.md)。
          - platform: windows-latest
            args: ""
          # 暂不构建 Linux(用户决定)
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # 复用 ci.yml 同款编译缓存：发布此前每次冷编译 800+ crate（含 ort/tauri），两平台各 ~40 分钟
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 随包内置语义模型（bge-small-zh-v1.5，~90MB，逐文件 sha256 校验）。模型按仓库策略
      # 不入 git，发布产物必须带上它——否则默认开启的语义通道（rewrite 检测依赖）开箱即缺。
      # 校验失败即终止发布，绝不出「静默无语义」的安装包。
      - name: 内置语义模型（sha256 校验）
        shell: bash
        run: ./scripts/fetch-embedding-model.sh

      # macOS 签名/公证：secrets 配齐才把 env 注入后续步骤（tauri CLI 对空串 APPLE_CERTIFICATE
      # 的行为未定义，静态映射会让未配证书的发布翻车——按需注入则两种状态都稳）。
      # KEYCHAIN_PASSWORD 为 runner 一次性临时钥匙串口令，现场生成，不需配 secret。
      - name: 启用 macOS 签名（配置了 secrets 时）
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          _CERT: ${{ secrets.APPLE_CERTIFICATE }}
          _CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PWD: ${{ secrets.APPLE_PASSWORD }}
          _TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$_CERT" ]; then
            echo "未配置 Apple 签名 secrets，产出未签名包（Gatekeeper 需用户手动放行）"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__EOF__"; echo "$_CERT"; echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$_CERT_PWD"
            echo "APPLE_SIGNING_IDENTITY=$_IDENTITY"
            echo "APPLE_ID=$_APPLE_ID"
            echo "APPLE_PASSWORD=$_APPLE_PWD"
            echo "APPLE_TEAM_ID=$_TEAM_ID"
            echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
          echo "已注入 Apple 签名与公证凭据"

      # Windows Authenticode：secrets 配齐才导入证书库，并以 --config 文件注入 thumbprint
      # （tauri.conf.json 不写死指纹——证书轮换只换 secrets，不改仓库）。
      - name: 启用 Windows 签名（配置了 secrets 时）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          _CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          _CERT_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:_CERT) {
            Write-Host "未配置 Windows 签名 secrets，产出未签名包（SmartScreen 会提示未知发布者）"
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:_CERT))
          $pwd = ConvertTo-SecureString $env:_CERT_PWD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\sign.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
          $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 4
          Set-Content -Path "$env:RUNNER_TEMP\sign-win.json" -Value $cfg -Encoding utf8
          "TAURI_SIGN_ARGS=--config $env:RUNNER_TEMP\sign-win.json" >> $env:GITHUB_ENV
          Write-Host "已导入签名证书（thumbprint $($cert.Thumbprint)）"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名：私钥与密码存在 GitHub Secrets。
          # tauri.conf.json 已配 createUpdaterArtifacts:true + 公钥，构建时生成 .sig 与 latest.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 代码签名凭据由上方「启用 macOS/Windows 签名」步骤按 secrets 是否配置动态注入
          # （APPLE_* 走 GITHUB_ENV；Windows thumbprint 走 TAURI_SIGN_ARGS 的 --config 文件）
        with:
          # tag 推送时 ref_name 即 tag；手动触发时用 inputs.tag（否则 ref_name=分支名会建出错误 tag）
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "BidGuard ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "原本 · 标书查重 —— 本地标书交叉比对与围标识别。发布草稿后 latest.json 才对旧版本生效。"
          releaseDraft: true
          prerelease: false
          # 生成并上传 latest.json（自动更新清单）
          includeUpdaterJson: true
          # TAURI_SIGN_ARGS：Windows 签名步骤注入的 --config <thumbprint 文件>；未配置时为空
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}
