[package]
name = "bidguard"
version = "0.5.0"
description = "原本 · 标书查重 — 离线标书交叉比对与围标识别"
authors = ["原本 Verum"]
edition = "2021"
# MSRV：oar-ocr 0.7.1 要求 Rust ≥ 1.95；显式声明使旧工具链得到清晰报错而非深处编译失败。
rust-version = "1.95"

[lib]
# `_lib` 后缀避免与 bin 重名（Windows 下的已知问题）
name = "bidguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"    # 导出后用系统默认程序打开报告 / Finder 定位
tauri-plugin-log = "2"       # 日志落盘（app_log_dir，不含正文）
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 引擎依赖（纯 Rust，无系统库依赖）
zip = { version = "2", default-features = false, features = ["deflate"] } # 解 docx(zip)
quick-xml = "0.39"   # 解析 docx 正文与元数据 XML
jieba-rs = "0.7"     # 中文分词
pdf-extract = "0.7"  # PDF 文本抽取回落（纯 Rust，文本型 PDF）
pdfium-render = "0.8" # 更鲁棒的 PDF 文本抽取（绑定 libpdfium 原生库）
lopdf = "0.34"       # 读 PDF 元数据指纹（Info 字典）
similar = "2"        # 字符级 diff（逐对对比高亮）
rust_xlsxwriter = "0.79" # 导出 Excel 报告
fastembed = "5"      # 语义查重（中文 embedding；ort rc.12，与 oar-ocr 对齐）
oar-ocr = "0.7"      # 扫描件中文 OCR（PaddleOCR ONNX via ort rc.12）
ureq = "3"           # 按需下载 OCR 高精档 .tar（已在依赖树，提升为直接依赖）
tar = "0.4"          # 解压 PaddleOCR .tar 推理包取 inference.onnx
image = "0.25"       # 栅格化 PDF 页 → RgbImage 喂 OCR
encoding_rs = "0.8"  # GBK/GB18030 文本解码（国标编码标书）
r2d2_sqlite = { version = "0.34.0", features = ["bundled"] }
r2d2 = "0.8.10"
thiserror = "2.0.18"
chrono = "0.4.45"
rusqlite = "0.39"
uuid = { version = "1.23.3", features = ["v4"] }
sha2 = "0.11.0"
rayon = "1.12.0"
regex = "1.12.4"
twox-hash = "2.1.2"
unicode-normalization = "0.1.25"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
calamine = { version = "0.35.0", features = ["dates"] }
