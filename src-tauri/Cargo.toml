[package]
name = "bidguard"
version = "0.5.0"
description = "原本 · 标书查重 — 离线标书交叉比对与围标识别"
authors = ["原本 Verum"]
edition = "2021"
# MSRV：oar-ocr 0.7.1 要求 Rust ≥ 1.95；显式声明使旧工具链得到清晰报错而非深处编译失败。
rust-version = "1.95"

[lib]
# `_lib` 后缀避免与 bin 重名（Windows 下的已知问题）
name = "bidguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# dev-tools：仅开发期编译的合成语料生成器/回归 harness，绝不进发布二进制。
# Enables the synthetic-corpus generator (engine::corpusgen) and its `corpusgen` bin.
dev-tools = []

# 合成对抗语料生成器 CLI（M3 校准语料）：cargo run --bin corpusgen --features dev-tools
[[bin]]
name = "corpusgen"
path = "src/bin/corpusgen.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"    # 导出后用系统默认程序打开报告 / Finder 定位
tauri-plugin-log = "2"       # 日志落盘（app_log_dir，不含正文）
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 引擎依赖（纯 Rust，无系统库依赖）
zip = { version = "2", default-features = false, features = ["deflate"] } # 解 docx(zip)
# 解析 docx 正文与元数据 XML（不可信输入）。≥0.41 修复 RUSTSEC-2026-0194（重复属性名检查的
# 二次方复杂度）与 -0195（NsReader 命名空间声明无界分配导致内存耗尽）。
quick-xml = "0.41"
jieba-rs = "0.7"     # 中文分词
pdf-extract = "0.12" # PDF 文本抽取回落（纯 Rust，文本型 PDF）；随其自带的 lopdf 一并升到已修复版
pdfium-render = "0.9" # 更鲁棒的 PDF 文本抽取（绑定 libpdfium 原生库）
# 读 PDF 元数据指纹（Info 字典）与内容流审计。≥0.42 修复 RUSTSEC-2026-0187（深嵌套 PDF 对象
# 栈溢出）——本应用直接解析投标人提供的不可信 PDF，属必修。停在 0.42 而非 0.44：0.44 与树内
# time crate 不兼容（BorrowedFormatItem::StringLiteral 已移除），且 0.42 与 pdf-extract 自带的
# 版本一致，可让树内只保留一份 lopdf。
lopdf = "0.42"
similar = "2"        # 字符级 diff（逐对对比高亮）
rust_xlsxwriter = "0.79" # 导出 Excel 报告
fastembed = "5"      # 语义查重（中文 embedding；ort rc.12，与 oar-ocr 对齐）
oar-ocr = "0.7"      # 扫描件中文 OCR（PaddleOCR ONNX via ort rc.12）
ureq = "3"           # 按需下载 OCR 高精档 .tar（已在依赖树，提升为直接依赖）
tar = "0.4"          # 解压 PaddleOCR .tar 推理包取 inference.onnx
image = "0.25"       # 栅格化 PDF 页 → RgbImage 喂 OCR
encoding_rs = "0.8"  # GBK/GB18030 文本解码（国标编码标书）
r2d2_sqlite = { version = "0.34.0", features = ["bundled"] }
r2d2 = "0.8.10"
thiserror = "2.0.18"
chrono = "0.4.45"
rusqlite = "0.39"
uuid = { version = "1.23.3", features = ["v4"] }
sha2 = "0.11.0"
rayon = "1.12.0"
regex = "1.12.4"
twox-hash = "2.1.2"
unicode-normalization = "0.1.25"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# 0.36 起改用 quick-xml 0.41：0.35 会把带漏洞的 quick-xml 0.39 拖进依赖树
# （RUSTSEC-2026-0194/-0195），而 xlsx 同样是投标人提供的不可信输入。
calamine = { version = "0.36", features = ["dates"] }

# 授权/激活（license 模块）：纯 Rust，无系统库依赖
ed25519-dalek = { version = "2", default-features = false, features = ["std"] } # 许可验签（仅公钥）
hmac = "0.13"          # 授权状态文件 tamper-evidence（配 sha2 0.11 / digest 0.11）
data-encoding = "2"    # 许可 base64url / 机器码 base32(Crockford)
machine-uid = "0.5"    # 机器指纹锚（macOS IOPlatformUUID / Windows MachineGuid）
